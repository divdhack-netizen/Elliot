[package]
name = "elliot-repeater"
edition.workspace = true
version.workspace = true

[dependencies]
elliot-httpraw = { path = "../httpraw" }

tokio = { workspace = true, features = ["net", "io-util", "time"] }
# rustls (aws-lc-rs provider, matching the proxy) for the TLS variant; no OpenSSL.
tokio-rustls = "0.26"
rustls = "0.23"
rustls-pki-types = "1"
webpki-roots = "0.26"

httparse = "1"
bytes = "1"
thiserror = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["net", "io-util", "time", "rt-multi-thread", "macros"] }

[lints]
workspace = true
