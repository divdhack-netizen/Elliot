[package]
name = "elliot-httpraw"
edition.workspace = true
version.workspace = true

[dependencies]
serde = { workspace = true }
bytes = { version = "1", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
http = "1"

[lints]
workspace = true

[dev-dependencies]
