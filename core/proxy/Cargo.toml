[package]
name = "elliot-proxy"
edition.workspace = true
version.workspace = true

[dependencies]
elliot-httpraw = { path = "../httpraw" }
# Shared TLS policy: with `verify_upstream=false` the permissive upstream
# `ClientConfig` comes from here.
elliot-tls = { path = "../tls" }

# Only used for the opt-in permissive upstream connector (`verify_upstream=false`).
hyper-rustls = { version = "0.27", default-features = false, features = ["http1", "http2", "tls12", "webpki-tokio", "logging"] }

# MITM proxy engine (hyper + rustls + rcgen under the hood). Default features
# already bring rustls-client + rcgen-ca + the decoder; http2 is opt-in.
hudsucker = { version = "0.25", features = ["http2"] }

tokio = { workspace = true, features = ["sync", "net"] }
http = "1"
bytes = "1"
uuid = { version = "1", features = ["v4"] }
http-body-util = "0.1"
httparse = "1"
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = "0.1"

[dev-dependencies]
# A real policy engine for the scope-enforcement test.
elliot-scope = { path = "../scope" }
tokio = { workspace = true, features = ["sync", "time", "rt-multi-thread", "macros", "net", "io-util"] }
# A self-signed loopback HTTPS server for the upstream-verification test.
tokio-rustls = "0.26"
rcgen = { version = "0.14.7", features = ["x509-parser"] }
tempfile = "3"

[lints]
workspace = true
